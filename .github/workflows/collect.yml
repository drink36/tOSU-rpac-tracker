name: Collect RPAC Occupancy

on:
  schedule:
    - cron: '*/15 * * * *'  # every 15 minutes (GitHub runs it less often in practice)
  workflow_dispatch:         # allow manual trigger from GitHub UI

permissions:
  contents: write

# Never let two runs push at the same time.
concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt

      # Exits with an error if any rec center couldn't be fetched, which marks the
      # run as failed (GitHub emails the repo owner). The steps below still run, so
      # whatever was fetched is saved.
      - name: Record occupancy
        run: python rpac.py

      - name: Update site data, README tables and grid
        if: ${{ !cancelled() }}
        run: python rpac.py --site --readme --grid

      - name: Commit and push
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -- *_stats.csv rpac_grid.csv README.md docs/data.json
          git diff --staged --quiet && exit 0
          git commit -m "data: $(date -u '+%Y-%m-%d %H:%M UTC')"
          for attempt in 1 2 3 4; do
            git push && exit 0
            echo "Push failed (attempt $attempt), retrying..."
            sleep $((attempt * 15))
            git pull --rebase origin main || { git rebase --abort; exit 1; }
          done
          exit 1
